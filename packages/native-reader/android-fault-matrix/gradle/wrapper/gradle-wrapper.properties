distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 仅使用官方分发（CMPAA-241 P2-4）：Gradle 9.3.1 与外部 consumer（RN 0.86.3 模板）一致。
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
# 固定官方 SHA-256（来源：https://services.gradle.org/distributions/gradle-9.3.1-bin.zip.sha256）。
# wrapper 下载后强制校验；摘要不匹配即失败，保证分发可复现、不可被镜像/中间人替换。
distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
# 官方源会 302 到 GitHub releases CDN；实测 10s 读超时在网络抖动时会直接
# "Downloading ... failed: timeout (10000ms)"，干净环境无法落地 wrapper。
# 放宽到 60s 只影响单次读超时，不降低校验强度（distributionSha256Sum 仍强制）。
networkTimeout=60000
validateDistributionUrl=true
